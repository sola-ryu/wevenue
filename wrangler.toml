name = "wevenue"
compatibility_date = "2025-07-01"

[vars]
OPENWEBUI_URL = "https://chat.xusix.com"
OPENWEBUI_MODEL = "qwen/qwen3.6-35b-a3b"
LMSTUDIO_URL = "http://127.0.0.1:1234"
LMSTUDIO_MODEL = "qwen/qwen3.6-35b-a3b"

[[d1_databases]]
binding = "DB"
database_name = "wevenue"
database_id = "40cd560a-704e-40bf-a502-fb0bb09a5813"
migrations_dir = "d1"

[[r2_buckets]]
bucket_name = "wevenue"
binding = "wevenue"

[[vpc_services]]
binding = "VPC_SERVICE"
service_id = "019f62ab-527e-79d3-89d9-079fdca54129"
remote = true

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = false

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
