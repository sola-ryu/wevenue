name = "wevenue"
compatibility_date = "2025-07-01"

[vars]
OPENWEBUI_URL = "https://chat.xusix.com"

[[d1_databases]]
binding = "DB"
database_name = "wevenue"
database_id = "40cd560a-704e-40bf-a502-fb0bb09a5813"
migrations_dir = "d1"

[[r2_buckets]]
bucket_name = "wevenue"
binding = "wevenue"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = false

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
